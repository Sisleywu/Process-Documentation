<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisley's Process Documentation</title> 
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Sisley's Process Documentation</h1>

    </header>

    <div class="container">
        <!-- LEFT SIDEBAR -->
        <nav class="sidebar">
            <button onclick="showWeek('week1')">Week 01</button>
        </nav>

        <!-- RIGHT CONTENT -->
        <main class="content">
            <section class="week" id="week1">
            <h2>Week1</h2>
            <img src="images/week1 reflection.JPG" alt="Week 1 process">
            <img src="images/blob.JPG" alt="Week 1 process">
            <p>
            This week we just started our class and did a drawing blob activity.
            </p>
             </section>
        </main>
    </div>

    <script>

    function showWeek(weekId) {

      // Find all sections with class="week"
      const weeks = document.querySelectorAll('.week');

      // Hide all weeks
      weeks.forEach(function(week) {
        week.style.display = 'none';
      });

      // Show the selected week
      document.getElementById(weekId).style.display = 'block';

    }

    // Show Week 1 when the website first opens
    showWeek('week1');
    </script>

</body>
</header>
</html>
